# Nexus 3 for Kiwi remote market (template packs + plugin JARs).
# Usage: docker compose -f docker/nexus/docker-compose.yml up -d
services:
  nexus:
    image: sonatype/nexus3:3.76.0
    container_name: kiwi-nexus
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  nexus_data:
